  <style>
  /* Reset & Base */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body, html {
    height: 100%;
    overflow: hidden;
    background: #f0f0f0; 
    color: #333;
  }
  
  /* Import Google Font for a clean look */
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700;800&display=swap');

  /*
  ==================================================
  CHART CONTAINER STYLE (TradingView - Background)
  OPACITY 1.0 (100%)
  ==================================================
  */
  .chart-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Opacity set to 1.0 (100%) */
      opacity: 1.0; 
      z-index: 5; 
      pointer-events: none; /* Allows clicks to pass through to the content */
      filter: none; 
  }

  /*
  ==================================================
  Content Styling (Investing.com Inspired)
  *** Content Background Opacity Reduced for Chart Visibility ***
  ==================================================
  */
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 10;
    padding: 20px;
    /* Reduced white overlay opacity to 0.80 (20% transparency) for chart visibility */
    background: rgba(255, 255, 255, 0.80); 
  }
  
  h1 {
    font-size: 3.5em; 
    margin-bottom: 5px;
    color: #212121; 
    font-weight: 800; 
  }
  
  /* Main Service Line - ITALIC */
  h2 {
    font-size: 1.8em;
    margin-bottom: 40px;
    color: #1a73e8; /* Blue accent color */
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-style: italic;
  }

  p {
    font-size: 1.2em; 
    color: #555; 
    margin-bottom: 40px;
    max-width: 650px;
    font-weight: 400;
  }

  /* WhatsApp Button - DARK GREEN & NO EMOJI */
  .whatsapp-btn {
    background: #075e54; /* Deep Green */
    color: #ffffff; 
    font-size: 1.3em;
    padding: 15px 40px;
    border-radius: 4px; 
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    text-transform: uppercase;
    font-weight: 700;
  }

  .whatsapp-btn:hover {
    transform: translateY(-2px); 
    background: #128c7e; /* Slightly lighter green on hover */
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

</style>

<body>
  
<div class="background"></div>

<div class="chart-overlay">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div id="tradingview_chart" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget(
      {
      "width": "100%",
      "height": "100%",
      "symbol": "FX_IDC:XAUUSD",
      "interval": "5",
      "timezone": "Etc/UTC",
      "theme": "light", /* Light theme for Investing.com style */
      "style": "1", /* Candlesticks style */
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "hide_legend": true,
      "hide_side_toolbar": true,
      "save_image": false,
      "container_id": "tradingview_chart"
    }
      );
      </script>
    </div>
    </div>

<div class="content">
  
  <h1>GOLD (XAU/USD) TRADING</h1>
  <h2>ELITE ACCOUNT MANAGEMENT</h2>
  
  <p>Profit from volatility with our professionally managed accounts. We leverage expert analysis and disciplined strategies to grow your capital in the Forex and Gold markets.</p>

    GET FREE CONSULTATION ON WHATSAPP
  </button>
</div>
