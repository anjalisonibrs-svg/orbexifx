<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Account Management - Orbexi FX Style (Updated for Funding Pips Look)</title>
<style>
  /* Reset & Base */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body, html {
    height: 100%;
    overflow: hidden;
    /* Updated background to use a dark blue/purple from Funding Pips brand colors: #0C1267 (RGB 12, 18, 103) */
    background: #0C1267; 
    color: #fff; /* Default white text */
  }
  
  /* Import Google Font for a clean look */
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700;800&display=swap');

  /*
  ==================================================
  CHART CONTAINER STYLE (TradingView - Background)
  OPACITY 1.0 (100%) - Adjusted for dark theme
  ==================================================
  */
  .chart-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: .4; 
      z-index: 5; 
      pointer-events: none; 
      /* Optional: You can add a subtle filter to match a trading vibe, but for now, it's neutral. */
      filter: none; 
  }

  /*
  ==================================================
  Content Styling (Funding Pips Dark Overlay)
  ==================================================
  */
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 10;
    padding: 20px;
    /* Dark blue overlay (85% opaque) for text readability over the chart. Using a darker shade from FP: #000042 */
    background: rgba(0, 0, 66, 0.85); 
  }
  
  h1 {
    font-size: 3.5em; 
    margin-bottom: 5px;
    /* White text is maintained */
    color: #ffffff; 
    font-weight: 800; 
  }
  
  /* Main Service Line - ITALIC & RED (Orbexi FX Red is maintained) */
  h2 {
    font-size: 1.8em;
    margin-bottom: 40px;
    color: #e52627; 
    font-weight: 700; 
    text-transform: uppercase;
    letter-spacing: 2px;
    font-style: italic;
  }

  p {
    font-size: 1.2em; 
    /* Lighter white for body text */
    color: #e0e0e0; 
    margin-bottom: 40px;
    max-width: 650px;
    font-weight: 400;
  }

  /*
  ==================================================
  WhatsApp Button - Orbexi FX Red is maintained
  ==================================================
  */
  .whatsapp-btn {
    /* Red color from Orbexi FX logo */
    background: #e52627; 
    color: #ffffff; 
    font-size: 1.3em;
    padding: 15px 40px;
    border-radius: 4px; 
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    text-transform: uppercase;
    font-weight: 700;
  }

  .whatsapp-btn:hover {
    transform: translateY(-2px); 
    /* Slightly darker red on hover */
    background: #cc0000; 
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

</style>
</head>
<body>
  
<div class="background"></div>

<div class="chart-overlay">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div id="tradingview_chart" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget(
      {
      "width": "100%",
      "height": "100%",
      "symbol": "FX_IDC:XAUUSD",
      "interval": "5",
      "timezone": "Etc/UTC",
      "theme": "dark", /* Changed to DARK theme to match the new dark blue background */
      "style": "3", /* Line Chart Style */
      "locale": "en",
      "toolbar_bg": "#0C1267", /* Updated toolbar to match Funding Pips blue */
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "hide_legend": true,
      "hide_side_toolbar": true,
      "save_image": false,
      "container_id": "tradingview_chart"
    }
      );
      </script>
    </div>
    </div>

<div class="content">
  
  <h1>GOLD (XAU/USD) TRADING</h1>
  <h2>ELITE ACCOUNT MANAGEMENT</h2>
  
  <p>Profit from volatility with our professionally managed accounts. We leverage expert analysis and disciplined strategies to grow your capital in the Forex and Gold markets.</p>
  
  <button class="whatsapp-btn" onclick="window.location='https://wa.me/1234567890?text=I%27m%20interested%20in%20Forex%20Account%20Management%20Service';">
    GET FREE CONSULTATION ON WHATSAPP
  </button>
</div>

</body>
</html>
