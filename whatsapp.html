<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Landing Page</title>
<style>
  /* Reset & base */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body, html {
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    color: #fff;
  }

  /* Motion background with floating particles */
  .background {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1c1c1c, #0a0a0a);
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(37, 211, 102, 0.7);
    animation: float 10s linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) translateX(100px) scale(1); opacity: 0; }
  }

  /* Center content */
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 10;
  }

  h1 {
    font-size: 3em;
    margin-bottom: 20px;
    color: #25d366;
    animation: fadeInUp 1s ease forwards;
  }

  p {
    font-size: 1.2em;
    color: #ccc;
    margin-bottom: 40px;
    animation: fadeInUp 1.5s ease forwards;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* WhatsApp Button */
  .whatsapp-btn {
    background: #25d366;
    color: #fff;
    font-size: 1.2em;
    padding: 15px 30px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 5px 20px rgba(37, 211, 102, 0.5);
    animation: pulse 2s infinite;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .whatsapp-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.7);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 rgba(37, 211, 102, 0.4); }
    50% { box-shadow: 0 0 20px rgba(37, 211, 102, 0.7); }
    100% { box-shadow: 0 0 0 rgba(37, 211, 102, 0.4); }
  }

  /* WhatsApp icon animation */
  .whatsapp-icon {
    font-size: 1.5em;
    animation: bounce 1.5s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

</style>
</head>
<body>

<div class="background" id="background"></div>

<div class="content">
  <h1>Connect With Us on WhatsApp</h1>
  <p>Fast, reliable, and secure messaging for all your needs.</p>
  <button class="whatsapp-btn" onclick="window.location='https://wa.me/1234567890';">
    <span class="whatsapp-icon">💬</span> Chat Now
  </button>
</div>

<script>
  // Create floating particles
  const bg = document.getElementById('background');
  for(let i=0; i<50; i++){
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.width = `${Math.random()*10 + 5}px`;
    p.style.height = p.style.width;
    p.style.left = `${Math.random()*100}%`;
    p.style.animationDuration = `${5 + Math.random()*10}s`;
    p.style.animationDelay = `${Math.random()*5}s`;
    bg.appendChild(p);
  }
</script>

</body>
</html>
